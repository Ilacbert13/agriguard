# https://docs.railway.com/guides/config-as-code
[build]
builder = "DOCKERFILE"

[deploy]
# Wait for MySQL TCP, then migrate → seed → CSV import (see docker/agriguard-predeploy.sh).
preDeployCommand = "/usr/local/bin/agriguard-predeploy"
startCommand = "/usr/local/bin/agriguard-web"
healthcheckPath = "/up"
# Seconds Railway waits for HTTP 2xx on healthcheckPath (raise if cold starts + migrate/seed are slow).
healthcheckTimeout = 300
