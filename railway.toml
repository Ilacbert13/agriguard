# https://docs.railway.com/guides/config-as-code
#
# Railway dashboard MUST match this file:
#
# Build → Builder: Docker (from Dockerfile), NOT Railpack — image installs Composer deps only;
# Vite runs at container start (`npm install && npm run build` + `serve` below).
#
# Deploy → Pre-deploy command: leave COMPLETELY EMPTY.
#   Never put `php artisan serve` here (that's the Start command).
#
# Deploy → Custom Start Command: leave empty so `startCommand` below applies.
#
# No Railway Shell? Run DB setup locally against prod DB, or temporarily set startCommand to
# docker/agriguard-start.sh (migrate+seed+import then serve) — see README.

[build]
builder = "DOCKERFILE"

[deploy]
# Inner script uses double quotes so ${PORT:-10000} expands (single-quoted sh -c would not).
startCommand = "sh -c \"npm install && npm run build && php artisan serve --host 0.0.0.0 --port ${PORT:-10000}\""
healthcheckPath = "/up"
healthcheckTimeout = 600
