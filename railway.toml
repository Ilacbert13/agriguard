# https://docs.railway.com/guides/config-as-code
[build]
builder = "DOCKERFILE"

[deploy]
# Do not use preDeployCommand for migrate: it often cannot reach private MySQL (*.railway.internal).
# DB setup runs in the container start script (docker/agriguard-start.sh) instead.
startCommand = "/usr/local/bin/agriguard-start"
healthcheckPath = "/up"
# Migrate + seed + CSV import can exceed 5m on first deploy — increase if healthchecks fail.
healthcheckTimeout = 600
